name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate integration types
        run: npm run generate-integration-types

      - name: Run Biome check
        run: npx biome check .

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
